name: LoanAssist CI/CD

on:
  push:
    branches: ["**"]          # Fast unit tests on EVERY branch push
  pull_request:
    branches: [main, develop]  # Full eval gate on PRs to main/develop

jobs:
  # ── Job 1: Unit tests (fast, no Docker, runs on every push) ───────────────
  unit-tests:
    name: Unit Tests (rules + calculators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Run unit tests
        run: |
          cd api
          python -m pytest tests/test_calculators.py tests/test_rules_engine.py -v \
            --tb=short --no-header \
            -q 2>&1 | tee /tmp/unit-test-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: /tmp/unit-test-results.txt

  # ── Job 2: Promptfoo eval gate (full stack, PRs only) ─────────────────────
  eval-gate:
    name: Promptfoo Eval Gate (eligibility accuracy)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run the expensive eval gate on pull requests to main/develop
    if: github.event_name == 'pull_request'
    env:
      API_KEY:   local-dev-key
      LLM_MODEL: qwen-local
      ACTIVE_PERSONAL_LOAN_VERSION: v2
      ACTIVE_HOME_LOAN_VERSION: v1
      ACTIVE_AUTO_LOAN_VERSION: v1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node.js (for promptfoo)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ingest RAG policies
        run: |
          pip install -r api/requirements.txt pyyaml
          python rag/ingest.py

      - name: Build and start the stack
        run: docker compose up -d --wait --timeout 120
        timeout-minutes: 5

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf http://localhost:8001/health \
              | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            if [ "$status" = "ok" ]; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          curl -sf http://localhost:8001/health | python -m json.tool

      - name: Run Promptfoo evaluation
        run: bash scripts/eval-gate.sh
        env:
          API_KEY: ${{ env.API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: 1

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: |
            promptfoo-output.json
            promptfoo-output.html

      - name: Stop stack
        if: always()
        run: docker compose down
